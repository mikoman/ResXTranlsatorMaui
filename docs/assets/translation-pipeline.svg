<svg width="960" height="590" viewBox="0 0 960 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">ResXTranslator translation pipeline</title>
  <desc id="description">Source RESX, CSV, or XLSX files are split into bounded batches, translated through an OpenRouter model, and strictly validated. Valid jobs write source-preserving output; failed jobs stop without writing current-job output.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L8 5L1 9" stroke="#512BD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="590" rx="28" fill="#F7F5FF"/>

  <g stroke="#512BD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M290 119H350"/>
    <path d="M610 119H670"/>
    <path d="M800 188V226H480V260"/>
    <path d="M480 386V424H220V447"/>
    <path d="M480 424H730V447"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g>
      <rect x="40" y="50" width="250" height="138" rx="18" fill="#FFFFFF" stroke="#D9D0F7" stroke-width="2"/>
      <text x="64" y="88" fill="#512BD4" font-size="15" font-weight="700" letter-spacing="1.2">SOURCE</text>
      <text x="64" y="124" fill="#242424" font-size="24" font-weight="700">Localization files</text>
      <text x="64" y="157" fill="#636366" font-size="17">RESX · CSV · XLSX</text>
    </g>

    <g>
      <rect x="350" y="50" width="260" height="138" rx="18" fill="#FFFFFF" stroke="#D9D0F7" stroke-width="2"/>
      <text x="374" y="88" fill="#512BD4" font-size="15" font-weight="700" letter-spacing="1.2">PREPARE</text>
      <text x="374" y="124" fill="#242424" font-size="24" font-weight="700">Bounded batches</text>
      <text x="374" y="157" fill="#636366" font-size="17">≤ 40 strings · ≤ 10k chars</text>
    </g>

    <g>
      <rect x="670" y="50" width="250" height="138" rx="18" fill="#FFFFFF" stroke="#D9D0F7" stroke-width="2"/>
      <text x="694" y="88" fill="#512BD4" font-size="15" font-weight="700" letter-spacing="1.2">TRANSLATE</text>
      <text x="694" y="124" fill="#242424" font-size="24" font-weight="700">OpenRouter model</text>
      <text x="694" y="157" fill="#636366" font-size="17">Streaming structured output</text>
    </g>

    <g>
      <rect x="290" y="260" width="380" height="126" rx="18" fill="#FFFFFF" stroke="#512BD4" stroke-width="3"/>
      <text x="480" y="300" fill="#512BD4" font-size="15" font-weight="700" letter-spacing="1.2" text-anchor="middle">VALIDATE</text>
      <text x="480" y="338" fill="#242424" font-size="25" font-weight="700" text-anchor="middle">Every batch passes?</text>
      <text x="480" y="368" fill="#636366" font-size="17" text-anchor="middle">Strict IDs, counts, and JSON schema</text>
    </g>

    <text x="220" y="417" fill="#1F6D32" font-size="15" font-weight="700" text-anchor="middle">ALL VALID</text>
    <text x="730" y="417" fill="#8E201A" font-size="15" font-weight="700" text-anchor="middle">ANY FAILURE</text>

    <g>
      <rect x="60" y="447" width="320" height="105" rx="18" fill="#EAF8EE" stroke="#7ECF90" stroke-width="2"/>
      <text x="220" y="489" fill="#1F6D32" font-size="23" font-weight="700" text-anchor="middle">Write localized output</text>
      <text x="220" y="522" fill="#356D43" font-size="17" text-anchor="middle">Original source stays untouched</text>
    </g>

    <g>
      <rect x="560" y="447" width="340" height="105" rx="18" fill="#FFF1F0" stroke="#E99A94" stroke-width="2"/>
      <text x="730" y="489" fill="#8E201A" font-size="23" font-weight="700" text-anchor="middle">Stop the job</text>
      <text x="730" y="522" fill="#8E3D38" font-size="17" text-anchor="middle">No current-job output is written</text>
    </g>
  </g>
</svg>
